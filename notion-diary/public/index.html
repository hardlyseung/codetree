<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>먼작귀 다이어리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Jua&display=swap" rel="stylesheet">
<style>
  /* 먼작귀 글꼴 파일이 있다면 public/fonts/cute.woff2 (또는 .ttf)로 넣으면 자동으로 우선 적용됩니다 */
  @font-face { font-family: 'CuteFont'; src: url('/fonts/cute.woff2') format('woff2'), url('/fonts/cute.ttf') format('truetype'); font-display: swap; }
  :root {
    --font-body: 'CuteFont', 'Gaegu', 'Jua', sans-serif;
    --font-title: 'CuteFont', 'Jua', 'Gaegu', sans-serif;
    --bg: #fff4f6; --paper: #fffdfa; --ink: #5b4a44; --muted: #a8968f; --line: #f6dde3;
    --outline: #6b5650; --accent: #ff8fab; --accent-soft: #ffe3ea; --sky: #cfeaff; --butter: #fff2b8;
    --shadow: 0 4px 0 var(--outline);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #2a2328; --paper: #362d33; --ink: #f6e6ea; --muted: #b8a3aa; --line: #4a3c44;
      --outline: #1c171a; --accent: #ff9fb8; --accent-soft: #553a45; --sky: #34485a; --butter: #57502f; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; color: var(--ink); font-family: var(--font-body); font-size: 19px; line-height: 1.7;
    background-color: var(--bg);
    background-image: radial-gradient(var(--line) 2px, transparent 2.5px), radial-gradient(var(--line) 2px, transparent 2.5px);
    background-size: 36px 36px; background-position: 0 0, 18px 18px; }
  header { max-width: 1100px; margin: 0 auto; padding: 28px 16px 8px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  header h1 { font-family: var(--font-title); font-size: 2.2rem; margin: 0; font-weight: 400; letter-spacing: -.5px; }
  header h1::after { content: ' ✧'; color: var(--accent); }
  .badge { font-size: .85rem; padding: 2px 12px; border-radius: 99px; background: var(--butter); border: 2px solid var(--outline); }
  .spacer { flex: 1; }
  button { font: inherit; cursor: pointer; border: 2.5px solid var(--outline); background: var(--paper); color: var(--ink);
    border-radius: 999px; padding: 4px 16px; box-shadow: 0 3px 0 var(--outline); transition: transform .08s, box-shadow .08s; }
  button:hover:not(:disabled) { transform: translateY(-1px); }
  button:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 0 0 var(--outline); }
  button.primary { background: var(--accent); color: #fff; font-family: var(--font-title); }

  main { max-width: 1100px; margin: 0 auto; padding: 8px 16px 48px; display: grid; grid-template-columns: 320px 1fr; gap: 24px; align-items: start; }
  @media (max-width: 820px) { main { grid-template-columns: 1fr; } }
  .card { background: var(--paper); border: 3px solid var(--outline); border-radius: 28px; box-shadow: var(--shadow); padding: 18px; }
  aside { position: sticky; top: 16px; display: grid; gap: 18px; }
  @media (max-width: 820px) { aside { position: static; } }

  .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .cal-head strong { font-family: var(--font-title); font-size: 1.25rem; font-weight: 400; }
  .cal-head button { padding: 0 12px; font-size: 1.1rem; }
  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; text-align: center; }
  .cal .dow { font-size: .85rem; color: var(--muted); }
  .cal .dow:first-child { color: var(--accent); } .cal .dow:nth-child(7) { color: #7fb4e0; }
  .cal .day { aspect-ratio: 1; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-size: 1rem; border: 2px solid transparent; padding: 0; background: none; box-shadow: none; line-height: 1.1; }
  .cal .day.has { background: var(--accent-soft); border-color: var(--outline); font-weight: 700; }
  .cal .day.today { border: 2px dashed var(--accent); }
  .cal .day.sel { background: var(--accent); color: #fff; border: 2px solid var(--outline); }
  .cal .day .emo { font-size: .7rem; height: .8rem; }
  .cal .day:disabled { cursor: default; }

  .stats { display: flex; justify-content: space-around; text-align: center; background: var(--sky); }
  .stats b { display: block; font-family: var(--font-title); font-weight: 400; font-size: 1.7rem; }
  .stats span { font-size: .85rem; }

  .list { display: grid; gap: 8px; max-height: 40vh; overflow: auto; padding: 2px 2px 6px; }
  .list button { text-align: left; display: flex; gap: 10px; align-items: center; border-radius: 18px; padding: 6px 10px;
    border-width: 2px; box-shadow: 0 2px 0 var(--outline); }
  .list button.active { background: var(--butter); }
  .list small { color: var(--muted); display: block; font-size: .8rem; line-height: 1.2; }

  article.page { position: relative; min-height: 70vh; padding: 0; overflow: visible; border-radius: 32px;
    background-image: repeating-linear-gradient(transparent 0 33px, var(--line) 33px 35px); background-color: var(--paper); }
  /* 마스킹테이프 장식 */
  article.page::before { content: ''; position: absolute; top: -14px; left: 50%; width: 120px; height: 28px; transform: translateX(-50%) rotate(-3deg);
    background: repeating-linear-gradient(45deg, var(--accent-soft) 0 8px, var(--butter) 8px 16px); border: 2px solid var(--outline); border-radius: 6px; opacity: .95; }
  .cover { height: 180px; background-size: cover; background-position: center; border-radius: 29px 29px 0 0; border-bottom: 3px solid var(--outline); }
  .page-inner { padding: 36px 40px 48px; }
  @media (max-width: 600px) { .page-inner { padding: 28px 18px 36px; } }
  .date { display: inline-block; font-size: 1rem; background: var(--accent-soft); border: 2px solid var(--outline); border-radius: 99px; padding: 0 14px; }
  .page h1 { margin: 10px 0 8px; font-family: var(--font-title); font-weight: 400; font-size: 1.9rem; display: flex; gap: 10px; align-items: center; }
  .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 20px; }
  .tags span { font-size: .85rem; background: var(--sky); border: 2px solid var(--outline); border-radius: 99px; padding: 0 10px; }
  .content { font-size: 1.15rem; overflow-wrap: anywhere; }
  .content h2, .content h3, .content h4 { font-family: var(--font-title); font-weight: 400; }
  .content h3::before, .content h2::before { content: '♡ '; color: var(--accent); }
  .content img { max-width: 100%; border-radius: 20px; border: 3px solid var(--outline); }
  .content figure { margin: 16px 0; } .content figcaption { color: var(--muted); font-size: .9rem; text-align: center; }
  .content blockquote { border-left: 4px dotted var(--accent); margin: 12px 0; padding: 2px 14px; color: var(--muted); }
  .content pre { background: var(--bg); padding: 12px; border-radius: 16px; border: 2px solid var(--line); overflow: auto; }
  .content code { background: var(--butter); padding: 1px 6px; border-radius: 8px; font-size: .9em; }
  .content pre code { background: none; }
  .content .callout { display: flex; gap: 10px; background: var(--butter); border: 2px solid var(--outline); padding: 10px 14px; border-radius: 20px; margin: 12px 0; }
  .content .todo { display: flex; gap: 8px; align-items: center; }
  .content .todo .box { width: 20px; height: 20px; border: 2px solid var(--outline); border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: .7rem; color: #fff; flex: none; }
  .content .todo.done .box { background: var(--accent); }
  .content .todo.done span:last-child { text-decoration: line-through 2px var(--accent); color: var(--muted); }
  .content hr { border: none; text-align: center; margin: 20px 0; }
  .content hr::after { content: '· ✿ · ✿ ·'; color: var(--accent); }
  .content details { margin: 8px 0; } .content summary { cursor: pointer; }
  .content a { color: var(--accent); }
  .muted { color: var(--muted); }
  .c-gray { color: #9b9a97 } .c-brown { color: #a0765a } .c-orange { color: #e88a3c } .c-yellow { color: #d1a619 }
  .c-green { color: #5aa47a } .c-blue { color: #5a9fd6 } .c-purple { color: #a07cc5 } .c-pink { color: #e86a9a } .c-red { color: #e0605a }
  [class$="_background"] { padding: 0 3px; border-radius: 6px; background: var(--accent-soft); }
  .footer-link { margin-top: 28px; font-size: .95rem; }
  .empty { text-align: center; padding: 80px 20px; color: var(--muted); }
  .empty .big { font-family: var(--font-title); font-size: 1.9rem; color: var(--ink); }
  .empty .big::before { content: '(  ˶ˆ꒳ˆ˵ )'; display: block; font-size: 2.4rem; margin-bottom: 8px; color: var(--accent); }
  .error { background: #ffe1e1; color: #b33a3a; border: 2px solid var(--outline); padding: 10px 14px; border-radius: 18px; margin-bottom: 12px; }

  dialog { border: 3px solid var(--outline); border-radius: 28px; background: var(--paper); color: var(--ink); box-shadow: 0 6px 0 var(--outline);
    width: min(560px, calc(100vw - 32px)); padding: 24px; font-family: var(--font-body); }
  dialog h2 { font-family: var(--font-title); font-weight: 400; }
  dialog::backdrop { background: rgba(255, 180, 200, .35); }
  dialog form { display: grid; gap: 10px; }
  dialog input, dialog textarea { font: inherit; padding: 6px 14px; border: 2.5px solid var(--outline); border-radius: 18px; background: var(--bg); color: var(--ink); min-width: 0; }
  dialog textarea { min-height: 220px; resize: vertical; background-image: repeating-linear-gradient(transparent 0 31px, var(--line) 31px 32px); line-height: 32px; }
  .row { display: flex; gap: 8px; } .row > * { flex: 1; } .row input[name=icon] { flex: 0 0 64px; text-align: center; }
  .moods { display: flex; gap: 6px; flex-wrap: wrap; }
  .moods button { padding: 0 8px; font-size: 1.2rem; box-shadow: 0 2px 0 var(--outline); border-width: 2px; }
</style>
</head>
<body>
<header>
  <h1>🍙 <span id="diaryName">나의 다이어리</span></h1>
  <span class="badge" id="modeBadge" hidden>데모 모드</span>
  <div class="spacer"></div>
  <button id="todayBtn">오늘</button>
  <button class="primary" id="writeBtn" hidden>✏️ 오늘 일기 쓰기</button>
</header>

<main>
  <aside>
    <section class="card">
      <div class="cal-head">
        <button id="prevBtn" aria-label="이전 달">‹</button>
        <strong id="monthLabel"></strong>
        <button id="nextBtn" aria-label="다음 달">›</button>
      </div>
      <div class="cal" id="calendar"></div>
    </section>
    <section class="card stats">
      <div><b id="statCount">0</b><span>이번 달 일기</span></div>
      <div><b id="statStreak">0</b><span>연속 기록</span></div>
      <div><b id="statMood">-</b><span>자주 쓴 아이콘</span></div>
    </section>
    <section class="card"><div class="list" id="list"></div></section>
  </aside>

  <article class="card page" id="page">
    <div class="empty"><div class="big">불러오는 중…</div></div>
  </article>
</main>

<dialog id="writeDialog">
  <form method="dialog" id="writeForm">
    <h2 style="margin:0">새 일기</h2>
    <div class="row">
      <input name="icon" value="📝" maxlength="4" aria-label="아이콘">
      <input name="title" placeholder="제목" required>
      <input name="date" type="date" required>
    </div>
    <div class="moods" id="moods"></div>
    <textarea name="content" placeholder="오늘은 어떤 작고 귀여운 일이 있었나요?"></textarea>
    <div class="row" style="justify-content:flex-end">
      <button value="cancel" formnovalidate style="flex:0">취소</button>
      <button class="primary" value="save" style="flex:0">노션에 저장</button>
    </div>
  </form>
</dialog>

<script>
const $ = (s) => document.querySelector(s);
const pad = (n) => String(n).padStart(2, '0');
const ymd = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const state = { cursor: new Date(), entries: [], selectedId: null, info: {} };
state.cursor.setDate(1);

async function api(path, opts) {
  const res = await fetch(path, opts);
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}

function monthKey() { return `${state.cursor.getFullYear()}-${pad(state.cursor.getMonth() + 1)}`; }

function formatDate(s) {
  const d = new Date(s + 'T00:00:00');
  return `${d.getFullYear()}년 ${d.getMonth() + 1}월 ${d.getDate()}일 ${'일월화수목금토'[d.getDay()]}요일`;
}

async function loadMonth() {
  $('#monthLabel').textContent = `${state.cursor.getFullYear()}년 ${state.cursor.getMonth() + 1}월`;
  $('#list').innerHTML = '<p class="muted">불러오는 중…</p>';
  try {
    state.entries = await api(`/api/entries?month=${monthKey()}`);
  } catch (e) {
    state.entries = [];
    $('#page').innerHTML = `<div class="page-inner"><div class="error">노션을 불러오지 못했어요: ${esc(e.message)}</div><p class="muted">통합(Integration)에 페이지/데이터베이스가 공유되어 있는지 확인해 주세요.</p></div>`;
  }
  renderCalendar(); renderList(); renderStats();
  if (state.entries.length && !state.entries.some((e) => e.id === state.selectedId)) openEntry(state.entries[0].id);
  else if (!state.entries.length) showEmpty();
}

function byDate() {
  const map = {};
  for (const e of state.entries) (map[e.date] ||= []).push(e);
  return map;
}

function renderCalendar() {
  const y = state.cursor.getFullYear(), m = state.cursor.getMonth();
  const first = new Date(y, m, 1).getDay();
  const days = new Date(y, m + 1, 0).getDate();
  const map = byDate();
  const today = ymd(new Date());
  const sel = state.entries.find((e) => e.id === state.selectedId)?.date;
  let html = [...'일월화수목금토'].map((d) => `<div class="dow">${d}</div>`).join('');
  html += '<div></div>'.repeat(first);
  for (let d = 1; d <= days; d++) {
    const key = `${y}-${pad(m + 1)}-${pad(d)}`;
    const items = map[key];
    const cls = ['day', items && 'has', key === today && 'today', key === sel && 'sel'].filter(Boolean).join(' ');
    html += `<button class="${cls}" data-date="${key}" ${items ? '' : 'disabled'} title="${items ? esc(items.map((i) => i.title).join(', ')) : ''}">
      ${d}<span class="emo">${items ? esc(items[0].icon || '•') : ''}</span></button>`;
  }
  $('#calendar').innerHTML = html;
}

function renderList() {
  $('#list').innerHTML = state.entries.length
    ? state.entries.map((e) => `<button data-id="${e.id}" class="${e.id === state.selectedId ? 'active' : ''}">
        <span style="font-size:1.3rem">${esc(e.icon || '📄')}</span>
        <span><span>${esc(e.title)}</span><small>${esc(e.date)}</small></span></button>`).join('')
    : '<p class="muted" style="text-align:center">이 달의 일기가 없어요</p>';
}

function renderStats() {
  const dates = new Set(state.entries.map((e) => e.date));
  $('#statCount').textContent = dates.size;
  // 이번 달 안에서 가장 긴 연속 기록 일수
  let best = 0, run = 0;
  const days = new Date(state.cursor.getFullYear(), state.cursor.getMonth() + 1, 0).getDate();
  for (let d = 1; d <= days; d++) {
    run = dates.has(`${monthKey()}-${pad(d)}`) ? run + 1 : 0;
    best = Math.max(best, run);
  }
  $('#statStreak').textContent = best;
  const counts = {};
  for (const e of state.entries) if (e.icon) counts[e.icon] = (counts[e.icon] || 0) + 1;
  $('#statMood').textContent = Object.entries(counts).sort((a, b) => b[1] - a[1])[0]?.[0] || '-';
}

function showEmpty() {
  $('#page').innerHTML = `<div class="empty"><div class="big">텅 빈 페이지</div><p>${state.cursor.getMonth() + 1}월에는 아직 기록이 없어요.</p>
    ${state.info.canWrite ? '<button class="primary" onclick="openWrite()">✏️ 일기 쓰기</button>' : ''}</div>`;
}

async function openEntry(id) {
  state.selectedId = id;
  renderCalendar(); renderList();
  $('#page').innerHTML = '<div class="empty"><div class="big">페이지를 넘기는 중…</div></div>';
  try {
    const e = await api(`/api/entries/${id}`);
    if (state.selectedId !== id) return;
    $('#page').innerHTML = `
      ${e.cover ? `<div class="cover" style="background-image:url('${esc(e.cover)}')"></div>` : ''}
      <div class="page-inner">
        <div class="date">${formatDate(e.date)}</div>
        <h1>${e.icon ? `<span>${esc(e.icon)}</span>` : ''}${esc(e.title)}</h1>
        <div class="tags">${e.tags.map((t) => `<span>#${esc(t)}</span>`).join('')}</div>
        <div class="content">${e.html || '<p class="muted">내용이 없어요.</p>'}</div>
        ${e.url ? `<p class="footer-link"><a href="${esc(e.url)}" target="_blank" rel="noopener" class="muted">노션에서 열기 ↗</a></p>` : ''}
      </div>`;
  } catch (err) {
    $('#page').innerHTML = `<div class="page-inner"><div class="error">${esc(err.message)}</div></div>`;
  }
}

function openWrite() {
  const f = $('#writeForm');
  f.reset();
  f.date.value = ymd(new Date());
  f.title.value = `${new Date().getMonth() + 1}월 ${new Date().getDate()}일의 기록`;
  $('#writeDialog').showModal();
}

$('#moods').innerHTML = ['🥹', '😊', '😭', '😤', '😴', '🥰', '🍙', '🍮', '🌸', '✨']
  .map((e) => `<button type="button">${e}</button>`).join('');
$('#moods').addEventListener('click', (ev) => { if (ev.target.tagName === 'BUTTON') $('#writeForm').icon.value = ev.target.textContent; });

$('#writeDialog').addEventListener('close', async () => {
  if ($('#writeDialog').returnValue !== 'save') return;
  const f = $('#writeForm');
  try {
    const created = await api('/api/entries', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ title: f.title.value, date: f.date.value, content: f.content.value, icon: f.icon.value }),
    });
    const d = new Date(created.date + 'T00:00:00');
    state.cursor = new Date(d.getFullYear(), d.getMonth(), 1);
    state.selectedId = created.id;
    await loadMonth();
    openEntry(created.id);
  } catch (e) { alert('저장 실패: ' + e.message); }
});

$('#calendar').addEventListener('click', (ev) => {
  const date = ev.target.closest('.day')?.dataset.date;
  const e = date && state.entries.find((x) => x.date === date);
  if (e) openEntry(e.id);
});
$('#list').addEventListener('click', (ev) => { const id = ev.target.closest('button')?.dataset.id; if (id) openEntry(id); });
$('#prevBtn').onclick = () => { state.cursor.setMonth(state.cursor.getMonth() - 1); loadMonth(); };
$('#nextBtn').onclick = () => { state.cursor.setMonth(state.cursor.getMonth() + 1); loadMonth(); };
$('#todayBtn').onclick = () => { state.cursor = new Date(); state.cursor.setDate(1); loadMonth(); };
$('#writeBtn').onclick = openWrite;
document.addEventListener('keydown', (ev) => {
  if (ev.target.closest('input, textarea, dialog')) return;
  if (ev.key === 'ArrowLeft') $('#prevBtn').click();
  if (ev.key === 'ArrowRight') $('#nextBtn').click();
});

(async () => {
  try {
    state.info = await api('/api/info');
    $('#diaryName').textContent = state.info.name;
    $('#modeBadge').hidden = !state.info.demo;
    $('#writeBtn').hidden = !state.info.canWrite;
  } catch {}
  loadMonth();
})();
</script>
</body>
</html>
