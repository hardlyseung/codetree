<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notion Diary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Nanum+Pen+Script&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #efe9df; --paper: #fffdf8; --ink: #2f2a24; --muted: #8a8174; --line: #e6dccb;
    --accent: #c0674b; --accent-soft: #f6e3da; --shadow: 0 10px 30px rgba(70, 50, 30, .12);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1d1b18; --paper: #27241f; --ink: #ece4d6; --muted: #9c9283; --line: #3a352d;
      --accent: #e08a6c; --accent-soft: #3d2c25; --shadow: 0 10px 30px rgba(0,0,0,.4); }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'Gowun Batang', serif; line-height: 1.75; }
  header { max-width: 1100px; margin: 0 auto; padding: 28px 16px 8px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  header h1 { font-family: 'Nanum Pen Script', cursive; font-size: 2.6rem; margin: 0; font-weight: 400; }
  .badge { font-size: .75rem; padding: 2px 10px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); }
  .spacer { flex: 1; }
  button { font: inherit; cursor: pointer; border: 1px solid var(--line); background: var(--paper); color: var(--ink); border-radius: 10px; padding: 6px 14px; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }

  main { max-width: 1100px; margin: 0 auto; padding: 8px 16px 48px; display: grid; grid-template-columns: 320px 1fr; gap: 24px; align-items: start; }
  @media (max-width: 820px) { main { grid-template-columns: 1fr; } }
  .card { background: var(--paper); border-radius: 16px; box-shadow: var(--shadow); padding: 18px; }
  aside { position: sticky; top: 16px; display: grid; gap: 16px; }
  @media (max-width: 820px) { aside { position: static; } }

  .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .cal-head strong { font-size: 1.1rem; }
  .cal-head button { padding: 2px 10px; }
  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
  .cal .dow { font-size: .75rem; color: var(--muted); }
  .cal .day { aspect-ratio: 1; border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: .9rem; border: 1px solid transparent; padding: 0; background: none; }
  .cal .day.has { background: var(--accent-soft); font-weight: 700; }
  .cal .day.today { border-color: var(--accent); }
  .cal .day.sel { background: var(--accent); color: #fff; }
  .cal .day .emo { font-size: .7rem; line-height: 1; height: .8rem; }
  .cal .day:disabled { cursor: default; opacity: .9; }

  .stats { display: flex; justify-content: space-around; text-align: center; }
  .stats b { display: block; font-size: 1.5rem; color: var(--accent); }
  .stats span { font-size: .8rem; color: var(--muted); }

  .list { display: grid; gap: 6px; max-height: 40vh; overflow: auto; }
  .list button { text-align: left; display: flex; gap: 10px; align-items: center; border: none; padding: 8px; }
  .list button.active { background: var(--accent-soft); }
  .list small { color: var(--muted); display: block; font-size: .75rem; }

  article.page { min-height: 70vh; padding: 0; overflow: hidden;
    background-image: repeating-linear-gradient(var(--paper) 0 31px, var(--line) 31px 32px); }
  .cover { height: 180px; background-size: cover; background-position: center; }
  .page-inner { padding: 32px 40px 48px; }
  @media (max-width: 600px) { .page-inner { padding: 24px 18px 36px; } }
  .date { font-family: 'Nanum Pen Script', cursive; font-size: 1.6rem; color: var(--accent); }
  .page h1 { margin: 4px 0 8px; font-size: 1.7rem; display: flex; gap: 10px; align-items: center; }
  .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 20px; }
  .tags span { font-size: .75rem; background: var(--accent-soft); color: var(--accent); border-radius: 99px; padding: 1px 10px; }
  .content { font-size: 1.05rem; overflow-wrap: anywhere; }
  .content img { max-width: 100%; border-radius: 10px; }
  .content figure { margin: 16px 0; } .content figcaption { color: var(--muted); font-size: .85rem; text-align: center; }
  .content blockquote { border-left: 3px solid var(--accent); margin: 12px 0; padding: 2px 14px; color: var(--muted); }
  .content pre { background: var(--bg); padding: 12px; border-radius: 10px; overflow: auto; }
  .content code { background: var(--bg); padding: 1px 5px; border-radius: 4px; font-size: .9em; }
  .content .callout { display: flex; gap: 10px; background: var(--bg); padding: 12px 14px; border-radius: 10px; margin: 12px 0; }
  .content .todo { display: flex; gap: 8px; align-items: center; }
  .content .todo .box { width: 18px; height: 18px; border: 1.5px solid var(--muted); border-radius: 4px; display: inline-flex; align-items: center; justify-content: center; font-size: .75rem; color: var(--accent); flex: none; }
  .content .todo.done span:last-child { text-decoration: line-through; color: var(--muted); }
  .content hr { border: none; border-top: 1px dashed var(--line); margin: 20px 0; }
  .content details { margin: 8px 0; } .content summary { cursor: pointer; }
  .content a { color: var(--accent); }
  .muted { color: var(--muted); }
  .c-gray { color: #9b9a97 } .c-brown { color: #a0765a } .c-orange { color: #d9730d } .c-yellow { color: #c29b10 }
  .c-green { color: #448361 } .c-blue { color: #337ea9 } .c-purple { color: #9065b0 } .c-pink { color: #c14c8a } .c-red { color: #d44c47 }
  [class$="_background"] { padding: 0 3px; border-radius: 3px; background: var(--accent-soft); }
  .footer-link { margin-top: 28px; font-size: .85rem; }
  .empty { text-align: center; padding: 80px 20px; color: var(--muted); }
  .empty .big { font-family: 'Nanum Pen Script', cursive; font-size: 2rem; color: var(--ink); }
  .error { background: #fbe4e1; color: #a5332a; padding: 10px 14px; border-radius: 10px; margin-bottom: 12px; }

  dialog { border: none; border-radius: 16px; background: var(--paper); color: var(--ink); box-shadow: var(--shadow); width: min(560px, calc(100vw - 32px)); padding: 24px; }
  dialog::backdrop { background: rgba(0,0,0,.35); }
  dialog form { display: grid; gap: 10px; }
  dialog input, dialog textarea { font: inherit; padding: 8px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); }
  dialog textarea { min-height: 220px; resize: vertical; }
  .row { display: flex; gap: 8px; } .row > * { flex: 1; } .row input[name=icon] { flex: 0 0 70px; text-align: center; }
  .moods { display: flex; gap: 4px; flex-wrap: wrap; }
  .moods button { padding: 2px 8px; font-size: 1.2rem; }
</style>
</head>
<body>
<header>
  <h1>📔 <span id="diaryName">나의 다이어리</span></h1>
  <span class="badge" id="modeBadge" hidden>데모 모드</span>
  <div class="spacer"></div>
  <button id="todayBtn">오늘</button>
  <button class="primary" id="writeBtn" hidden>✏️ 오늘 일기 쓰기</button>
</header>

<main>
  <aside>
    <section class="card">
      <div class="cal-head">
        <button id="prevBtn" aria-label="이전 달">‹</button>
        <strong id="monthLabel"></strong>
        <button id="nextBtn" aria-label="다음 달">›</button>
      </div>
      <div class="cal" id="calendar"></div>
    </section>
    <section class="card stats">
      <div><b id="statCount">0</b><span>이번 달 일기</span></div>
      <div><b id="statStreak">0</b><span>연속 기록</span></div>
      <div><b id="statMood">-</b><span>자주 쓴 아이콘</span></div>
    </section>
    <section class="card"><div class="list" id="list"></div></section>
  </aside>

  <article class="card page" id="page">
    <div class="empty"><div class="big">불러오는 중…</div></div>
  </article>
</main>

<dialog id="writeDialog">
  <form method="dialog" id="writeForm">
    <h2 style="margin:0">새 일기</h2>
    <div class="row">
      <input name="icon" value="📝" maxlength="4" aria-label="아이콘">
      <input name="title" placeholder="제목" required>
      <input name="date" type="date" required>
    </div>
    <div class="moods" id="moods"></div>
    <textarea name="content" placeholder="오늘 하루는 어땠나요?"></textarea>
    <div class="row" style="justify-content:flex-end">
      <button value="cancel" formnovalidate style="flex:0">취소</button>
      <button class="primary" value="save" style="flex:0">노션에 저장</button>
    </div>
  </form>
</dialog>

<script>
const $ = (s) => document.querySelector(s);
const pad = (n) => String(n).padStart(2, '0');
const ymd = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const state = { cursor: new Date(), entries: [], selectedId: null, info: {} };
state.cursor.setDate(1);

async function api(path, opts) {
  const res = await fetch(path, opts);
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}

function monthKey() { return `${state.cursor.getFullYear()}-${pad(state.cursor.getMonth() + 1)}`; }

function formatDate(s) {
  const d = new Date(s + 'T00:00:00');
  return `${d.getFullYear()}년 ${d.getMonth() + 1}월 ${d.getDate()}일 ${'일월화수목금토'[d.getDay()]}요일`;
}

async function loadMonth() {
  $('#monthLabel').textContent = `${state.cursor.getFullYear()}년 ${state.cursor.getMonth() + 1}월`;
  $('#list').innerHTML = '<p class="muted">불러오는 중…</p>';
  try {
    state.entries = await api(`/api/entries?month=${monthKey()}`);
  } catch (e) {
    state.entries = [];
    $('#page').innerHTML = `<div class="page-inner"><div class="error">노션을 불러오지 못했어요: ${esc(e.message)}</div><p class="muted">통합(Integration)에 페이지/데이터베이스가 공유되어 있는지 확인해 주세요.</p></div>`;
  }
  renderCalendar(); renderList(); renderStats();
  if (state.entries.length && !state.entries.some((e) => e.id === state.selectedId)) openEntry(state.entries[0].id);
  else if (!state.entries.length) showEmpty();
}

function byDate() {
  const map = {};
  for (const e of state.entries) (map[e.date] ||= []).push(e);
  return map;
}

function renderCalendar() {
  const y = state.cursor.getFullYear(), m = state.cursor.getMonth();
  const first = new Date(y, m, 1).getDay();
  const days = new Date(y, m + 1, 0).getDate();
  const map = byDate();
  const today = ymd(new Date());
  const sel = state.entries.find((e) => e.id === state.selectedId)?.date;
  let html = [...'일월화수목금토'].map((d) => `<div class="dow">${d}</div>`).join('');
  html += '<div></div>'.repeat(first);
  for (let d = 1; d <= days; d++) {
    const key = `${y}-${pad(m + 1)}-${pad(d)}`;
    const items = map[key];
    const cls = ['day', items && 'has', key === today && 'today', key === sel && 'sel'].filter(Boolean).join(' ');
    html += `<button class="${cls}" data-date="${key}" ${items ? '' : 'disabled'} title="${items ? esc(items.map((i) => i.title).join(', ')) : ''}">
      ${d}<span class="emo">${items ? esc(items[0].icon || '•') : ''}</span></button>`;
  }
  $('#calendar').innerHTML = html;
}

function renderList() {
  $('#list').innerHTML = state.entries.length
    ? state.entries.map((e) => `<button data-id="${e.id}" class="${e.id === state.selectedId ? 'active' : ''}">
        <span style="font-size:1.3rem">${esc(e.icon || '📄')}</span>
        <span><span>${esc(e.title)}</span><small>${esc(e.date)}</small></span></button>`).join('')
    : '<p class="muted" style="text-align:center">이 달의 일기가 없어요</p>';
}

function renderStats() {
  const dates = new Set(state.entries.map((e) => e.date));
  $('#statCount').textContent = dates.size;
  // 이번 달 안에서 가장 긴 연속 기록 일수
  let best = 0, run = 0;
  const days = new Date(state.cursor.getFullYear(), state.cursor.getMonth() + 1, 0).getDate();
  for (let d = 1; d <= days; d++) {
    run = dates.has(`${monthKey()}-${pad(d)}`) ? run + 1 : 0;
    best = Math.max(best, run);
  }
  $('#statStreak').textContent = best;
  const counts = {};
  for (const e of state.entries) if (e.icon) counts[e.icon] = (counts[e.icon] || 0) + 1;
  $('#statMood').textContent = Object.entries(counts).sort((a, b) => b[1] - a[1])[0]?.[0] || '-';
}

function showEmpty() {
  $('#page').innerHTML = `<div class="empty"><div class="big">텅 빈 페이지</div><p>${state.cursor.getMonth() + 1}월에는 아직 기록이 없어요.</p>
    ${state.info.canWrite ? '<button class="primary" onclick="openWrite()">✏️ 일기 쓰기</button>' : ''}</div>`;
}

async function openEntry(id) {
  state.selectedId = id;
  renderCalendar(); renderList();
  $('#page').innerHTML = '<div class="empty"><div class="big">페이지를 넘기는 중…</div></div>';
  try {
    const e = await api(`/api/entries/${id}`);
    if (state.selectedId !== id) return;
    $('#page').innerHTML = `
      ${e.cover ? `<div class="cover" style="background-image:url('${esc(e.cover)}')"></div>` : ''}
      <div class="page-inner">
        <div class="date">${formatDate(e.date)}</div>
        <h1>${e.icon ? `<span>${esc(e.icon)}</span>` : ''}${esc(e.title)}</h1>
        <div class="tags">${e.tags.map((t) => `<span>#${esc(t)}</span>`).join('')}</div>
        <div class="content">${e.html || '<p class="muted">내용이 없어요.</p>'}</div>
        ${e.url ? `<p class="footer-link"><a href="${esc(e.url)}" target="_blank" rel="noopener" class="muted">노션에서 열기 ↗</a></p>` : ''}
      </div>`;
  } catch (err) {
    $('#page').innerHTML = `<div class="page-inner"><div class="error">${esc(err.message)}</div></div>`;
  }
}

function openWrite() {
  const f = $('#writeForm');
  f.reset();
  f.date.value = ymd(new Date());
  f.title.value = `${new Date().getMonth() + 1}월 ${new Date().getDate()}일의 기록`;
  $('#writeDialog').showModal();
}

$('#moods').innerHTML = ['😊', '😢', '😡', '😴', '🥰', '🤔', '☀️', '🌧️', '💪', '📚']
  .map((e) => `<button type="button">${e}</button>`).join('');
$('#moods').addEventListener('click', (ev) => { if (ev.target.tagName === 'BUTTON') $('#writeForm').icon.value = ev.target.textContent; });

$('#writeDialog').addEventListener('close', async () => {
  if ($('#writeDialog').returnValue !== 'save') return;
  const f = $('#writeForm');
  try {
    const created = await api('/api/entries', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ title: f.title.value, date: f.date.value, content: f.content.value, icon: f.icon.value }),
    });
    const d = new Date(created.date + 'T00:00:00');
    state.cursor = new Date(d.getFullYear(), d.getMonth(), 1);
    state.selectedId = created.id;
    await loadMonth();
    openEntry(created.id);
  } catch (e) { alert('저장 실패: ' + e.message); }
});

$('#calendar').addEventListener('click', (ev) => {
  const date = ev.target.closest('.day')?.dataset.date;
  const e = date && state.entries.find((x) => x.date === date);
  if (e) openEntry(e.id);
});
$('#list').addEventListener('click', (ev) => { const id = ev.target.closest('button')?.dataset.id; if (id) openEntry(id); });
$('#prevBtn').onclick = () => { state.cursor.setMonth(state.cursor.getMonth() - 1); loadMonth(); };
$('#nextBtn').onclick = () => { state.cursor.setMonth(state.cursor.getMonth() + 1); loadMonth(); };
$('#todayBtn').onclick = () => { state.cursor = new Date(); state.cursor.setDate(1); loadMonth(); };
$('#writeBtn').onclick = openWrite;
document.addEventListener('keydown', (ev) => {
  if (ev.target.closest('input, textarea, dialog')) return;
  if (ev.key === 'ArrowLeft') $('#prevBtn').click();
  if (ev.key === 'ArrowRight') $('#nextBtn').click();
});

(async () => {
  try {
    state.info = await api('/api/info');
    $('#diaryName').textContent = state.info.name;
    $('#modeBadge').hidden = !state.info.demo;
    $('#writeBtn').hidden = !state.info.canWrite;
  } catch {}
  loadMonth();
})();
</script>
</body>
</html>
